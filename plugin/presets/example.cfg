// Example preset file. Install as game/insurgency/presets/<mapname>.cfg —
// the layout plugin looks it up by the running map's name.
//
// This is the plugin-facing half of the format in docs/layout-variants.md §5.
// `navlayout reverse <map> --cfg <path>` emits one of these; see docs/reverse.md.
// The generator emits two files per map: the rich JSON (metrics, provenance,
// why each layout was chosen — for humans and for tracing a bad layout back to
// the numbers that produced it) and this, which is KeyValues because SourceMod
// parses KeyValues natively and hand-rolling a JSON parser in SourcePawn to
// save one export step would be a bad trade.
"layout"
{
	"map"          "ministry_coop"
	// map + nav checksum. Not yet enforced; the plugin's live gate is the
	// post-load hull test, which catches a stale preset by its effects.
	"survey_hash"  "0000000000000000"

	"preset"
	{
		"name"  "stock"
		// A preset with no edits. Worth keeping first in the rotation: it is
		// the control, and it is what a round should look like when a
		// workshop update has invalidated everything else.
	}

	"preset"
	{
		"name"  "west-compound-3-approach"

		// Purely informational — the plugin never reads these. They are here
		// so that a layout someone complains about can be read off the server
		// without going back to the JSON.
		"metrics"
		{
			"attacker_path"   "1880"   // path distance, not straight line
			"defender_median" "420"
			"route_count"     "3"
			"detour_ratio"    "1.18"
		}

		"edit"
		{
			// Absolute move: set this entity's origin outright. Matched on
			// class + targetname + team.
			"1"
			{
				"class"   "ins_spawnzone"
				"target"  "spawnzone_1"
				"team"    "3"
				"origin"  "2252 -1024 88"
			}

			// Relative move, bounded by a box. ins_spawnpoint has no name and
			// binds to its zone by containment, so the points that were inside
			// the zone's *old* volume move by the same delta the zone did.
			// "within" is that old volume in world space: minx miny minz
			// maxx maxy maxz.
			//
			// A tight "within" plus an absolute "origin" places one point
			// exactly, and is what the generator emits: it is idempotent, so
			// two rules matching one entity cannot compound the way two
			// offsets would. Only one rule is applied per entity either way.
			"2"
			{
				"class"   "ins_spawnpoint"
				"team"    "3"
				"within"  "3629 -2414 2  4365 -1918 226"
				"offset"  "-1745 1142 -27"
			}

			// Restricted areas are brush volumes too, so they translate the
			// same way. They do not resize — that is geometry — which is what
			// the model-swap escape hatch in §8 is for.
			"3"
			{
				"class"   "ins_blockzone"
				"target"  "bz_ins_1"
				"origin"  "2100 -900 88"
			}

			// A rename, and no geometry at all. A stage is bound to a spawn
			// zone by targetname in maps/<map>.txt, and the lump is rewritten
			// before any entity exists, so handing the name "spawnzone_1" to
			// the volume standing on another rung gives that stage the ground
			// the map already authored there — with the spawn points already
			// inside it, at the coordinates the map shipped.
			//
			// Safe as a cycle (1 takes 5's name while 5 takes 1's): each lump
			// entry is visited once and stops at its first matching rule, so an
			// entry renamed A -> B is never re-read by the rule for B.
			//
			// A rule may carry a rename, a move, or both — both is a volume
			// borrowed from another zone and then slid onto its rung.
			"4"
			{
				"class"   "ins_spawnzone"
				"target"  "spawnzone_5"
				"team"    "3"
				"rename"  "spawnzone_1"
			}
		}

		// Caches are defined in maps/<name>.txt, not in the entity lump, so
		// they cannot be rewritten at load — they are teleported after they
		// spawn. CObjWeaponCache::Teleport is overridden in the server binary
		// and fixes up the cache's own trigger, so the game already supports
		// this, and one .txt then serves every preset.
		"objective"
		{
			"1"
			{
				"name"       "cache_a"
				// The control point's targetname. Named, not derived: a cache
				// called cache_a is marked by cachepoint_a, not cache_a_cp, and
				// guessing the suffix leaves the marker behind the cache.
				"cp"         "cachepoint_a"
				"origin"     "2100 -1100 32"
				"cp_offset"  "72"    // shipped convention: marker +72 above
			}
		}
	}
}
