[project]
name = "bspscout"
version = "0.1.0"
description = "Source-engine BSP layout scout: heightmaps, torso-level slices, bot-walkable area and capture-point siting"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pillow>=11",
    "matplotlib>=3.9",
    "scipy>=1.14",
]

[project.scripts]
bspscout = "bspscout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bspscout"]
